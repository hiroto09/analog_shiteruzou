<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  background: black;
  color: white;
  font-size: 140px;
  text-align: center;
  margin-top: 20%;
  font-family: sans-serif;
}
</style>
</head>
<body>

<div id="analog">🃏 起動中...</div>

<script>
const ws = new WebSocket("ws://192.168.200.150:8000/ws");

ws.onmessage = (event) => {
  const data = JSON.parse(event.data);
  document.getElementById("analog").innerText = "🃏 " + data.analog;
};

// 切断時リロード
ws.onclose = () => {
  setTimeout(() => location.reload(), 1000);
};
</script>

</body>
</html>
